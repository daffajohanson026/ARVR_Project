<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberQuest — AR Literasi Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
<style>
:root{
  --bg:#EEF0F6; --panel:#FFFFFF; --panel-2:#E4E7F2; --text:#1B1F33; --muted:#5B6180;
  --accent:#C8791F; --accent-2:#2E8B82; --danger:#C23B52; --line:#D4D8E6;
  --font-display:"Space Grotesk",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#161A2E; --panel:#212648; --panel-2:#2A3060; --text:#F4F1E8; --muted:#9AA0C3; --accent:#E7A33E; --accent-2:#5FD0C0; --danger:#E2566B; --line:#3A3F6B; }
}
:root[data-theme="dark"]{ --bg:#161A2E; --panel:#212648; --panel-2:#2A3060; --text:#F4F1E8; --muted:#9AA0C3; --accent:#E7A33E; --accent-2:#5FD0C0; --danger:#E2566B; --line:#3A3F6B; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-display);min-height:100%}
#app{max-width:720px;margin:0 auto;padding:28px 20px 60px}
h1,h2,h3{margin:0}
.eyebrow{font-family:var(--font-mono);font-size:12px;color:var(--accent-2)}
.hero{position:relative;padding:28px 22px;border-radius:18px;background:var(--panel);border:1px solid var(--line);margin-bottom:22px}
.hero h1{font-size:30px;line-height:1.15}
.hero p{color:var(--muted);margin:10px 0 0;max-width:46ch;line-height:1.5}
.corner{position:absolute;width:34px;height:34px;border:2px solid var(--accent);opacity:.8}
.corner.tl{top:12px;left:12px;border-right:0;border-bottom:0}
.corner.br{bottom:12px;right:12px;border-left:0;border-top:0;top:auto;left:auto}
.stats{display:flex;gap:10px;margin:18px 0 20px;flex-wrap:wrap}
.stat{flex:1 1 140px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.bar{height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:var(--accent-2)}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .id{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.status{font-size:12px;font-family:var(--font-mono);padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);align-self:flex-start}
.status.ok{color:var(--accent-2);border-color:var(--accent-2)}
.status.bad{color:var(--danger);border-color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--font-display);font-weight:600;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px}
.btn-primary{background:var(--accent);color:#1B1F33}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-primary:focus-visible,.btn-ghost:focus-visible,a:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.qr-wrap{background:#fff;border-radius:10px;padding:8px;display:inline-block}
.back{color:var(--muted);text-decoration:none;font-family:var(--font-mono);font-size:13px}
.ar-wrap{position:relative;border-radius:18px;overflow:hidden;background:#0a0d1a;max-width:460px;height:400px;margin:18px auto}
.ar-wrap a-scene{position:absolute;inset:0}
.ar-hint{position:absolute;bottom:0;left:0;right:0;padding:10px;text-align:center;color:#fff;font-family:var(--font-mono);font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}
.ar-skip{position:absolute;top:10px;right:10px}
.marker-ref{text-align:center;margin-top:10px}
.marker-ref img{width:120px;border:6px solid #fff;border-radius:6px}
.challenge{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
.challenge .scn{line-height:1.55;margin:4px 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;color:var(--text);font-weight:500}
.opt:hover{border-color:var(--accent-2)}
.opt.correct{border-color:var(--accent-2);background:color-mix(in srgb, var(--accent-2) 18%, var(--panel-2))}
.opt.wrong{border-color:var(--danger);background:color-mix(in srgb, var(--danger) 18%, var(--panel-2))}
.feedback{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.5}
.feedback.ok{background:color-mix(in srgb, var(--accent-2) 16%, transparent);border:1px solid var(--accent-2)}
.feedback.bad{background:color-mix(in srgb, var(--danger) 16%, transparent);border:1px solid var(--danger)}
.badge-banner{margin-top:18px;background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:18px;text-align:center}
body[data-print-only] .print-area{display:block !important}
body[data-print-only] .print-area *{display:revert !important}
@media print{ body *{display:none !important} }
.print-area{display:none}
.flyer{width:320px;margin:0 auto;border:2px dashed #333;padding:22px;text-align:center;color:#111;background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
const HIRO_IMG = "https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png";
const CP = [
 {id:"01",key:"phishing",icon:"✉️",title:"Phishing",geo:"primitive: box; height:1;width:1;depth:1",color:"#C8791F",
  scenario:'Kamu menemukan pesan: "SELAMAT! Anda memenangkan hadiah Rp5.000.000. Klik link berikut untuk mengambil hadiah." Apa yang kamu lakukan?',
  options:["Memeriksa pengirim dan URL terlebih dahulu.","Langsung membuka link karena ada hadiah.","Meneruskan pesan kepada teman.","Memberikan data pribadi untuk klaim hadiah."],
  correct:0, ok:"Benar! Pesan hadiah yang mendesakmu segera membuka link adalah pola umum phishing/scam.",
  bad:"Kurang tepat. Pesan hadiah yang mendesak untuk segera klik link adalah pola umum phishing — selalu periksa pengirim dan URL dulu."},
 {id:"02",key:"password",icon:"🔑",title:"Password",geo:"primitive: cylinder; radius:0.6;height:1",color:"#2E8B82",
  scenario:"Kamu mendaftar akun baru dan diminta membuat password. Mana password yang paling aman?",
  options:["Nama lengkap + tanggal lahir.","P@ssw0rd123","Frasa acak panjang seperti 'KopiHujan!92Senja'","123456"],
  correct:2, ok:"Tepat! Frasa panjang dan acak lebih sulit ditebak atau di-brute-force dibanding kata umum.",
  bad:"Belum aman. Password yang mudah ditebak atau sering dipakai orang lain gampang dibobol — gunakan frasa panjang dan unik."},
 {id:"03",key:"privasi",icon:"🕵️",title:"Privasi Digital",geo:"primitive: sphere; radius:0.7",color:"#7B61C0",
  scenario:"Sebuah kuis di media sosial menanyakan nama ibu kandung, kota lahir, dan nama hewan peliharaan pertamamu untuk 'mengetahui karaktermu'. Apa tindakan amanmu?",
  options:["Mengisi semua agar dapat hasil kuisnya.","Tidak mengisi — data itu sering dipakai sebagai jawaban keamanan akun bank/email.","Mengisi tapi hanya dibagikan ke teman dekat.","Mengisi dengan data palsu yang terlihat asli."],
  correct:1, ok:"Benar! Pertanyaan semacam ini sering sama persis dengan pertanyaan keamanan akun, jadi rawan disalahgunakan.",
  bad:"Hati-hati — pertanyaan seperti nama ibu kandung atau hewan peliharaan pertama sering dipakai sebagai pertanyaan keamanan akun."},
 {id:"04",key:"social",icon:"🎭",title:"Social Engineering",geo:"primitive: cone; radiusBottom:0.7;height:1.1",color:"#C23B52",
  scenario:'Seseorang menelepon mengaku dari "tim IT kampus" dan meminta kode OTP yang baru saja kamu terima untuk "verifikasi akun". Apa yang kamu lakukan?',
  options:["Memberikan kode OTP karena terdengar resmi.","Menutup telepon dan tidak memberi OTP — tim IT resmi tidak pernah meminta OTP.","Memberi sebagian kode saja.","Meminta nomor WhatsApp untuk kirim OTP lewat chat."],
  correct:1, ok:"Tepat! OTP bersifat rahasia — institusi resmi tidak pernah memintanya lewat telepon.",
  bad:"Ini modus social engineering. OTP tidak boleh dibagikan ke siapa pun, termasuk yang mengaku dari IT resmi."},
 {id:"05",key:"browsing",icon:"🌐",title:"Safe Browsing",geo:"primitive: torusKnot; radius:0.45;radiusTubular:0.08",color:"#E7A33E",
  scenario:'Kamu mendapat link "login-unsrat-id.com/verifikasi" yang meminta kamu masuk dengan akun kampus. Apa yang kamu lakukan?',
  options:["Login karena nama domainnya mirip kampus.","Memeriksa domain resmi kampus dan mengabaikan link ini jika tidak cocok.","Login lalu ganti password setelahnya.","Membagikan link ke grup kelas agar yang lain waspada tanpa mengecek dulu."],
  correct:1, ok:"Benar! Domain yang mirip tapi tidak identik dengan domain resmi adalah ciri khas situs palsu (typosquatting).",
  bad:"Waspada — domain yang mirip tapi bukan domain resmi kampus biasanya situs palsu untuk mencuri kredensial."}
];
const KEY="cyberquest_progress_v2";
function loadState(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function saveState(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
function badgeFor(c){ if(c>=5) return "Cyber Guardian"; if(c>=3) return "Cyber Defender"; return "Cyber Rookie"; }

function render(){
  const cp = new URLSearchParams(location.search).get("cp");
  const app = document.getElementById("app");
  const item = cp && CP.find(c=>c.id===cp);
  if(item) return renderCheckpoint(app, item);
  renderHome(app);
}

function renderHome(app){
  const state = loadState();
  const done = CP.filter(c=>state[c.id]?.done);
  const correct = CP.filter(c=>state[c.id]?.correct).length;
  app.innerHTML = `
    <div class="hero"><div class="corner tl"></div><div class="corner br"></div>
      <div class="eyebrow">PETA CHECKPOINT</div><h1>CyberQuest</h1>
      <p>Pindai marker Hiro di flyer kampus untuk memunculkan objek AR, lalu selesaikan tantangan literasi digital & keamanan siber di tiap checkpoint.</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="n">${done.length}/5</div><div class="l">CHECKPOINT SELESAI</div><div class="bar"><div style="width:${done.length/5*100}%"></div></div></div>
      <div class="stat"><div class="n">${correct*100}</div><div class="l">TOTAL POIN</div></div>
      <div class="stat"><div class="n">${badgeFor(correct)}</div><div class="l">LEVEL SAAT INI</div></div>
    </div>
    ${done.length===5 ? `<div class="badge-banner"><div class="eyebrow">MISI SELESAI</div><h2>${badgeFor(correct)}</h2><p style="color:var(--muted)">Benar ${correct} dari 5 checkpoint.</p></div>` : ""}
    <div class="grid" id="grid"></div>
    <p style="margin-top:22px"><button class="btn-ghost" id="resetBtn">Reset progres</button></p>
    <div class="print-area"><div class="flyer" id="flyerPrint"></div></div>
  `;
  const grid = document.getElementById("grid");
  CP.forEach(c=>{
    const st = state[c.id];
    const url = location.origin + location.pathname + "?cp=" + c.id;
    const statusHtml = st?.done ? (st.correct? `<span class="status ok">benar</span>` : `<span class="status bad">kurang tepat</span>`) : `<span class="status">belum dipindai</span>`;
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<div class="top"><div><div class="id">CHECKPOINT ${c.id}</div><h3>${c.icon} ${c.title}</h3></div>${statusHtml}</div>
      <div class="qr-wrap" id="qr-${c.id}"></div>
      <div class="row"><button class="btn-primary" data-open="${c.id}">Buka checkpoint</button><button class="btn-ghost" data-print="${c.id}" data-url="${url}">Cetak flyer</button></div>`;
    grid.appendChild(card);
    new QRCode(document.getElementById("qr-"+c.id), {text:url, width:104, height:104});
  });
  grid.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>location.href="?cp="+b.dataset.open));
  grid.querySelectorAll("[data-print]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.print, url=b.dataset.url, c=CP.find(x=>x.id===id);
    const fp = document.getElementById("flyerPrint");
    fp.innerHTML = `<h2>${c.icon} ${c.title}</h2><p>1. Pindai QR untuk membuka checkpoint</p><div id="qrPrint"></div><p style="font-size:12px;color:#555">Checkpoint ${id}</p><p>2. Arahkan kamera ke marker ini</p><img src="${HIRO_IMG}" style="width:140px">`;
    new QRCode(document.getElementById("qrPrint"), {text:url, width:160, height:160});
    document.body.setAttribute("data-print-only","1");
    window.print();
  }));
  document.getElementById("resetBtn").addEventListener("click",()=>{ saveState({}); render(); });
  window.onafterprint = ()=>document.body.removeAttribute("data-print-only");
}

function renderCheckpoint(app, item){
  app.innerHTML = `
    <a class="back" href="${location.pathname}">&larr; kembali ke peta</a>
    <div class="eyebrow" style="margin-top:14px">CHECKPOINT ${item.id}</div>
    <h1>${item.icon} ${item.title}</h1>
    <div class="ar-wrap">
      <a-scene embedded arjs="sourceType: webcam; debugUIEnabled:false;" vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true;">
        <a-marker preset="hiro" id="markerEl">
          <a-entity geometry="${item.geo}" material="color:${item.color};metalness:0.15;roughness:0.5" position="0 0.5 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"></a-entity>
          <a-text value="${item.title}" align="center" position="0 1.3 0" width="4" color="#FFFFFF"></a-text>
        </a-marker>
        <a-entity camera></a-entity>
      </a-scene>
      <button class="btn-ghost ar-skip" id="skipAr">Lewati AR</button>
      <div class="ar-hint" id="arHint">Arahkan kamera ke marker Hiro di bawah</div>
    </div>
    <div class="marker-ref"><img src="${HIRO_IMG}" alt="Marker Hiro"><div class="eyebrow" style="margin-top:6px">CETAK / TAMPILKAN MARKER INI</div></div>
    <div id="challengeHost"></div>
  `;
  let started = false;
  const marker = document.getElementById("markerEl");
  const hint = document.getElementById("arHint");
  marker.addEventListener("markerFound", ()=>{
    hint.textContent = "Marker terdeteksi ✓";
    if(!started){ started = true; setTimeout(()=>renderChallenge(item), 600); }
  });
  marker.addEventListener("markerLost", ()=>{ if(!started) hint.textContent = "Arahkan kamera ke marker Hiro di bawah"; });
  document.getElementById("skipAr").addEventListener("click", ()=>{ if(!started){ started = true; renderChallenge(item); } });
}

function renderChallenge(item){
  const host = document.getElementById("challengeHost");
  host.innerHTML = `<div class="challenge"><div class="eyebrow">TANTANGAN</div><p class="scn">${item.scenario}</p><div id="opts"></div><div id="fb"></div><div class="row" style="margin-top:14px" id="navRow"></div></div>`;
  const opts = document.getElementById("opts");
  item.options.forEach((text,i)=>{
    const b = document.createElement("button"); b.className = "opt"; b.textContent = text;
    b.addEventListener("click",()=>answer(item,i));
    opts.appendChild(b);
  });
  host.scrollIntoView({behavior:"smooth", block:"start"});
}

function answer(item, idx){
  document.querySelectorAll("#opts .opt").forEach((b,i)=>{
    b.disabled = true;
    if(i===item.correct) b.classList.add("correct"); else if(i===idx) b.classList.add("wrong");
  });
  const isCorrect = idx===item.correct;
  document.getElementById("fb").innerHTML = `<div class="feedback ${isCorrect?'ok':'bad'}">${isCorrect? '✅ ' + item.ok : '❌ ' + item.bad}</div>`;
  const state = loadState(); state[item.id] = {done:true, correct:isCorrect}; saveState(state);
  const next = CP[CP.findIndex(c=>c.id===item.id)+1];
  const nav = document.getElementById("navRow");
  nav.innerHTML = `<button class="btn-ghost" id="toMap">Kembali ke peta</button>` + (next? `<button class="btn-primary" id="toNext">Checkpoint berikutnya &rarr;</button>` : "");
  document.getElementById("toMap").addEventListener("click",()=>location.href=location.pathname);
  if(next) document.getElementById("toNext").addEventListener("click",()=>location.href="?cp="+next.id);
}

render();
</script>
</body>
</html>
